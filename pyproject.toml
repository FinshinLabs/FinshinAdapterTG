[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "finshin_adapter_tg" = "src" }
packages = ["finshin_adapter_tg", "finshin_adapter_tg.features"]

[project]
name = "finshin-adapter-tg"
version = "0.3.0"
description = "FinshinImpact 的 Telegram 适配器"
requires-python = ">=3.11,<4.0"
dependencies = [
    "finshin-sdk>=0.3.0,<0.4.0",
    "aiogram==3.29.1",
    "aiohttp==3.14.1",
    "aiohttp-socks==0.11.0",
]

[tool.finshin-adapter]
platform = "tg"

[project.entry-points."finshin.adapters"]
tg = "finshin_adapter_tg.entry:parts"

